name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production site
        run: npm run build

      - name: Verify dist homepage is production build
        run: |
          test -f dist/index.html
          test -f dist/support.html
          test -f dist/terms.html
          test -f dist/support/screenshot-goblin.html
          test -f dist/privacy/screenshot-goblin.html
          grep -q '/assets/' dist/index.html
          grep -q 'data-support-home' dist/support.html
          ! grep -q '/src/js/main.js' dist/index.html
          ! grep -q '/src/css/' dist/index.html

      - name: Publish dist to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          cname: thegiftedgirlkim.com
          force_orphan: true
